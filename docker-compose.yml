services:
  hadoop:
    build: ./hadoop
    container_name: hadoop
    hostname: hadoop
    volumes:
      - ./ventas_125052707.csv:/data/input/ventas_125052707.csv:ro
      - ./mapreduce:/mapreduce:ro
      - ./data-output:/data/output
    networks: [datamart-net]
    ports:
      - "2222:22"

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [datamart-net]
    ports:
      - "5432:5432"

  api:
    build: ./api
    env_file: .env
    depends_on:
      - db
    networks: [datamart-net]
    ports:
      - "8000:8000"

  cargador:
    image: python:3.12-slim
    depends_on:
      - db
    env_file: .env
    volumes:
      - ./scripts:/scripts:ro
      - ./data-output:/data-output:ro
    networks: [datamart-net]
    working_dir: /scripts
    command: sh -c "pip install psycopg2-binary -q && python cargar_resultados.py"

networks:
  datamart-net:

volumes:
  pgdata: